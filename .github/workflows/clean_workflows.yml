name: Clean up skipped, cancelled, errors workflow

on:
    workflow_dispatch:
        inputs:
            delete_target:
                description: 'Select status combination to delete'
                type: choice
                required: true
                default: 'all'
                options:
                - 'all'
                - 'cancelled'
                - 'failure'
                - 'skipped'
                - 'cancelled, failure'
                - 'cancelled, failure, skipped'

jobs:
    clean_up:
        runs-on: ubuntu-latest

        steps:
            - name: Delete workflows
              uses: Mattraks/delete-workflow-runs@v2
              with:
                token: ${{ secrets.GH_WORKFLOW_ADMIN_TOKEN }}
                repository: ${{ github.repository }}
                retain_days: 0
                keep_minimum_runs: 0
                delete_run_by_conclusion_pattern: ${{ github.event.inputs.delete_target }}