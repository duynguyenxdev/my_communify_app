name: Deploy ios app

on:
  pull_request: 
    branches:
      - main
    types:
      - closed
  push:
    branches:
      - main
      
jobs:
  deploy:
    if: github.event.pull_request.merged == true || github.event_name == 'push'
    runs-on: macos-latest
    timeout-minutes: ${{ fromJSON(vars.TIMEOUT_MINUTES_IOS) }}
    environment: production
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/ios/Gemfile

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
            channel: stable
            flutter-version: ${{ vars.FLUTTER_VERSION }}
            cache: true

      - name: Get Flutter Dependencies
        run: flutter pub get

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ vars.RUBY_VERSION }}
          bundler-cache: true
          
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ vars.XCODE_VERSION }}

      - name: Generate Release Notes
        id: release_notes
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            TITLE="${{ github.event.pull_request.title }}"
            BODY="${{ github.event.pull_request.body }}"
            RELEASE_NOTES=$(printf "PR: %s\n\n%s" "$TITLE" "$BODY")
          else
            RELEASE_NOTES=$(git log -1 --pretty=%B)
          fi

          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$RELEASE_NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Build & Upload to Testflight
        run: |
          cd ${{ github.workspace }}/ios
          echo '${{ secrets.APP_STORE_CONNECT_API_KEY }}' > ${{ env.APP_STORE_CONNECT_API_KEY_PATH }}

          # Setup flutter dart define
          cd ${{ github.workspace }}
          echo "BASE_URL=${{ vars.BASE_URL }}" >> .env
          echo "BASE_URL=${{ vars.WEB_SOCKET_URL }}" >> .env

          # Build and upload
          cd ${{ github.workspace }}/ios
          bundle exec fastlane build_and_upload_to_testflight
        env:
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          APP_STORE_CONNECT_API_KEY_PATH: ${{ github.workspace }}/app_store_connect_api_key.json
          RELEASE_NOTES: ${{ steps.release_notes.outputs.changelog }}
          IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APP_STORE_CONNECT_TEAM_ID: ${{ secrets.APP_STORE_CONNECT_TEAM_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
