name: Deploy ios app

on:
  push: 
    branches:
      - ci/deploy-ios
      
jobs:
  deploy:
    runs-on: macos-latest
    timeout-minutes: ${{ fromJSON(vars.TIMEOUT_MINUTES_IOS) }}
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/ios/Gemfile

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
            channel: stable
            flutter-version: ${{ vars.FLUTTER_VERSION }}
            cache: true

      - name: Get Flutter Dependencies
        run: flutter pub get

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ vars.RUBY_VERSION }}
          bundler-cache: true
          
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ vars.XCODE_VERSION }}

      - name: Build & Upload to Testflight
        run: |
          flutter build ios --config-only --no-codesign --no-pub
          cd ios
          echo '${{ secrets.APP_STORE_CONNECT_API_KEY }}' > ${{ env.APP_STORE_CONNECT_API_KEY_PATH }}
          bundle exec fastlane build
        env:
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          APP_STORE_CONNECT_API_KEY_PATH: ${{ github.workspace }}/app_store_connect_api_key.json
